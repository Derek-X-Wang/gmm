name: release

# Build + sign + publish a GMM release whenever a `v*` tag is pushed.
# The signed updater manifest (`latest.json`) is what
# tauri-plugin-updater fetches at runtime — see ADR 0004 + slice 13a
# (#2) for the full design.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      # tauri-action builds the MSI, signs the updater manifest with
      # TAURI_SIGNING_PRIVATE_KEY (decrypted using ..._PASSWORD), and
      # uploads the binary + `latest.json` + `.sig` to a draft GitHub
      # Release. We publish manually after smoke-testing the artefacts.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GMM ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Emits `latest.json` alongside the MSI; that's the URL
          # configured in tauri.conf.json's plugins.updater.endpoints.
          includeUpdaterJson: true
          projectPath: src-tauri

      # tauri-action reports the files it found after the bundler runs. Hash
      # that output instead of naming an MSI here so adding or changing bundle
      # targets cannot leave a shipped artefact out of the release notes.
      - name: Add SHA-256 digests to the release body
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_PATHS)) {
            throw "tauri-action reported no release artefacts to hash"
          }

          $artifactPaths = @($env:ARTIFACT_PATHS | ConvertFrom-Json)
          if ($artifactPaths.Count -eq 0) {
            throw "tauri-action reported no release artefacts to hash"
          }

          $hashRows = foreach ($artifactPath in $artifactPaths) {
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "tauri-action reported a missing release artefact: $artifactPath"
            }

            $digest = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash
            $name = [System.IO.Path]::GetFileName($artifactPath)
            "| ``$name`` | ``$($digest.ToLowerInvariant())`` |"
          }

          $beginMarker = "<!-- gmm-release-sha256:start -->"
          $endMarker = "<!-- gmm-release-sha256:end -->"
          $digestSection = @(
            $beginMarker
            "## Verify the download"
            ""
            "Run ``Get-FileHash -LiteralPath <downloaded-file> -Algorithm SHA256`` and compare its ``Hash`` value with the matching artefact below."
            ""
            "| Artefact | SHA-256 |"
            "| --- | --- |"
            $hashRows
            $endMarker
          ) -join "`n"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          $existingBody = [string]$release.body
          $sectionPattern = "(?s)$([regex]::Escape($beginMarker)).*?$([regex]::Escape($endMarker))"

          if ($existingBody -match $sectionPattern) {
            $releaseBody = [regex]::Replace(
              $existingBody,
              $sectionPattern,
              $digestSection
            )
          } elseif ([string]::IsNullOrWhiteSpace($existingBody)) {
            $releaseBody = $digestSection
          } else {
            $releaseBody = "$($existingBody.TrimEnd())`n`n$digestSection"
          }

          $payload = @{ body = $releaseBody } | ConvertTo-Json
          Invoke-RestMethod `
            -Uri $releaseUri `
            -Method Patch `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload | Out-Null
