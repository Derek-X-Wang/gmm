name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Tauri Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Frontend first — Tauri's cargo build needs the Vite output in `dist/`.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm tsc --noEmit
        run: pnpm tsc --noEmit

      # Frontend unit/component tests (vitest + testing-library, jsdom).
      # Cheap enough to run on both matrix entries.
      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

      # Rust check chain across the workspace.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # Build the whole workspace BEFORE running tests — the Windows-only
      # suites (session_smoke.rs, e2e_windows.rs) shell out to
      # victim.exe / noop_dll.dll from target/debug/.
      - name: cargo build
        working-directory: src-tauri
        run: cargo build --workspace

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      # Windows-only: smoke-test the gmm-loader FFI binding against the
      # vendored 3dmloader.dll — loads the DLL, installs the CBT hook,
      # spawns victim, waits for injection, and unhooks.
      - name: cargo xtask test-loader
        if: runner.os == 'Windows'
        run: cargo xtask test-loader

      - name: Upload GMM logs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gmm-logs-${{ matrix.os }}
          path: ${{ env.APPDATA }}\GMM\logs
          if-no-files-found: ignore

  # Builds the real MSI and exercises it the way a user would: silent
  # install, launch, verify the app reached a working state, uninstall.
  # Separate job so it runs in parallel with the matrix instead of
  # serialising behind it.
  installer:
    name: installer smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installer

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `tauri build` runs `pnpm build` itself via beforeBuildCommand.
      # createUpdaterArtifacts is switched off here because signing the
      # manifest needs TAURI_SIGNING_PRIVATE_KEY, which is a
      # release-only secret and must not be exposed to PR builds.
      - name: Build the app bundle
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install, launch, verify, uninstall
        shell: pwsh
        run: .github/scripts/installer-smoke.ps1

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-diagnostics
          path: |
            ${{ runner.temp }}/msi-install.log
            ${{ runner.temp }}/msi-uninstall.log
            ${{ env.APPDATA }}/GMM/logs
          if-no-files-found: ignore

  # Aggregator: branch protection keys off this single name.
  check:
    name: check
    needs: [build, installer]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix build did not all succeed (result=${{ needs.build.result }})"
            exit 1
          fi
          if [ "${{ needs.installer.result }}" != "success" ]; then
            echo "installer smoke did not succeed (result=${{ needs.installer.result }})"
            exit 1
          fi
