name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static only, on Linux, and independent of the build matrix: script defects
  # should fail in minutes without waiting for expensive Windows artifacts.
  script-lint:
    name: CI scripts parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the analyzer because both its rules and defaults change over time.
      # The in-repo settings select Warning-or-higher correctness rules; that
      # threshold catches StrictMode hazards without turning style into a gate.
      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Force

      - name: Parse and analyze PowerShell scripts
        run: pwsh -NoProfile -File .github/scripts/lint-ci-scripts.ps1

      - name: Prove PSScriptAnalyzer findings fail the linter
        run: pwsh -NoProfile -File .github/scripts/test-lint-ci-scripts.ps1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse and lint shell scripts
        run: |
          mapfile -t scripts < <(find .github/scripts -type f -name '*.sh' -print)
          [ "${#scripts[@]}" -gt 0 ] || { echo "no shell scripts found"; exit 1; }
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Test dead-origin alerting
        run: .github/scripts/test-dead-origin-issues.sh

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Tauri Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Frontend first — Tauri's cargo build needs the Vite output in `dist/`.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm tsc --noEmit
        run: pnpm tsc --noEmit

      # Frontend unit/component tests (vitest + testing-library, jsdom).
      # Cheap enough to run on both matrix entries.
      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

      # Rust check chain across the workspace.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # Build the whole workspace BEFORE running tests — the Windows-only
      # suites (session_smoke.rs, e2e_windows.rs) shell out to
      # victim.exe / noop_dll.dll from target/debug/.
      - name: cargo build
        working-directory: src-tauri
        run: cargo build --workspace

      # ADR 0005's PR-time guarantee. `manifest/recommended-importers.json`
      # is fetched at runtime by every released build, so a bad commit
      # reconfigures every install within minutes with no staged rollout.
      # The review gate on `main` plus this validator are the only things
      # in the way, which is why a malformed manifest has to be
      # *unmergeable* rather than merely noticed.
      #
      # Runs BEFORE `cargo test`, and that ordering is the point. The
      # test suite already refuses a malformed manifest — but it reports
      # it as an assertion failure inside
      # `anything_the_validator_accepts_the_app_can_parse`, which tells a
      # maintainer staring at a one-line manifest diff nothing about
      # *what* is wrong. The validator names the offending game key or
      # field, so it has to be the thing that fails first.
      #
      # It is also the command `manifest/README.md` tells a human to run.
      # Nothing ran it before, which is how it went unnoticed that the
      # documented invocation did not work at all.
      #
      # Deliberately offline. Live resolution is the scheduled
      # `upstream importers` workflow's business; putting GitHub's
      # availability on the critical path of merging would make the
      # manifest unmergeable whenever the API is rate-limited (#94).
      #
      # `-p` is required: the root package has a default-run binary, so
      # a bare `--bin` only searches that package.
      - name: validate the recommended-importers manifest
        working-directory: src-tauri
        run: cargo run -p gmm-manifest-validator --bin validate-manifest

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace


      # Windows-only: smoke-test the gmm-loader FFI binding against the
      # vendored 3dmloader.dll — loads the DLL, installs the CBT hook,
      # spawns victim, waits for injection, and unhooks.
      - name: cargo xtask test-loader
        if: runner.os == 'Windows'
        run: cargo xtask test-loader

      - name: Upload GMM logs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gmm-logs-${{ matrix.os }}
          path: ${{ env.APPDATA }}\GMM\logs
          if-no-files-found: ignore

  # Builds the real MSI and exercises it the way a user would: silent
  # install, launch, verify the app reached a working state, uninstall.
  # Separate job so it runs in parallel with the matrix instead of
  # serialising behind it.
  installer:
    name: installer smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installer

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `tauri build` runs `pnpm build` itself via beforeBuildCommand.
      # createUpdaterArtifacts is switched off here because signing the
      # manifest needs TAURI_SIGNING_PRIVATE_KEY, a release-only secret
      # that must not be exposed to PR builds.
      #
      # The override goes through a file rather than an inline `--config`
      # string: pwsh strips the double quotes out of inline JSON, and
      # tauri then rejects `{bundle:{...}}` as invalid.
      - name: Write CI bundle config override
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -Path ci-bundle.conf.json -Encoding utf8
          Get-Content ci-bundle.conf.json

      - name: Build the app bundle
        run: pnpm tauri build --config ci-bundle.conf.json

      - name: Install, launch, verify, uninstall
        shell: pwsh
        run: .github/scripts/installer-smoke.ps1

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-diagnostics
          path: ci-diagnostics
          if-no-files-found: ignore

  # The signed-update round trip, against a keypair generated for the
  # length of this job and thrown away with it. The release signing key
  # is a repository secret and is deliberately **not** available here —
  # nothing in this job reads it, and a PR from a fork could not use it
  # if it did.
  #
  # Its own job because it builds the bundle twice (version N and N+1),
  # which is the expensive part and would otherwise serialise behind the
  # matrix.
  #
  # `python -m http.server` serves the update endpoint on 127.0.0.1; it
  # is present on the windows-latest image.
  updater:
    name: installer lifecycle + updater e2e (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: updater

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build, sign, serve, update
        shell: pwsh
        run: .github/scripts/updater-e2e.ps1

      # Reuses the two MSIs the round trip just built. A sibling job
      # would have to run `tauri build --release` twice more for
      # overlapping coverage, roughly doubling the Windows CI bill —
      # #57's triage called that out and this is the alternative.
      #
      # Release profile: `tauri build` has already compiled this
      # dependency graph, so the fixture costs seconds rather than a
      # from-scratch debug build of everything.
      - name: Build the lifecycle fixture
        run: cargo build --release -p gmm-lifecycle-fixture
        working-directory: src-tauri

      - name: Upgrade, refuse downgrade, repair, uninstall
        shell: pwsh
        run: .github/scripts/installer-lifecycle.ps1

      - name: Upload updater diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-diagnostics
          path: ci-diagnostics
          if-no-files-found: ignore

  # Aggregator: branch protection keys off this single name.
  check:
    name: check
    needs: [script-lint, build, installer, updater]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.script-lint.result }}" != "success" ]; then
            echo "CI script lint did not succeed (result=${{ needs.script-lint.result }})"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix build did not all succeed (result=${{ needs.build.result }})"
            exit 1
          fi
          if [ "${{ needs.installer.result }}" != "success" ]; then
            echo "installer smoke did not succeed (result=${{ needs.installer.result }})"
            exit 1
          fi
          if [ "${{ needs.updater.result }}" != "success" ]; then
            echo "updater e2e did not succeed (result=${{ needs.updater.result }})"
            exit 1
          fi
