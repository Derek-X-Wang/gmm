# This compiler-resolved gate blocks three known collapsing Path methods in
# core. Keep it alongside tests/filesystem_uncertainty_boundary.rs: that
# structural test rejects named Result collapses through direct calls, nested
# local aliases, local bindings, ordinary Result combinators, UFCS, awaited async
# blocks, and the match/if-let/matches shapes its AST visitor can classify. It
# also rejects per-entry read_dir errors discarded by direct iterator flatten or
# filter_map(Result::ok), and by .ok(), if-let, let-else, or match on a recognized
# loop-bound entry Result. A NotFound exception must be an equality check against
# the matched error kind. Resolver-enabled read_dir loops also reject an
# unwrapped follow-up lookup.
#
# The structural test is not a Rust type checker. I/O hidden behind an unrelated
# helper name, passed across a function boundary, generated by a declarative or
# procedural macro, or emitted outside checked-in core source still requires
# review. ReadDir tracking is receiver-structural: iterator adapters between
# read_dir and flatten/filter_map, an enumerate adapter before a loop, IoResult
# aliases, map_while, flat_map, and entry.as_ref().ok() are not recognized.
# Without type resolution, unrelated receiver methods named metadata, file_type,
# read_dir, or try_exists can be false positives. An intentional best-effort
# probe must carry a written reason on the one let statement that contains it;
# function-level allows are rejected by the structural test.
#
# Target-gated code is linted only when Clippy runs for that target. A green
# non-Windows host run therefore does not prove that Windows-only core code
# passes this deny; Windows CI remains required.
disallowed-methods = [
    { path = "std::path::Path::exists", reason = "Path::exists collapses every metadata error into false; use core::filesystem so only NotFound means absent" },
    { path = "std::path::Path::is_dir", reason = "Path::is_dir collapses every metadata error into false; inspect fallible metadata or explicitly annotate a best-effort probe" },
    { path = "std::path::Path::is_file", reason = "Path::is_file collapses every metadata error into false; inspect fallible metadata or explicitly annotate a best-effort probe" },
]
